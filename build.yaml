changelog: >
  Fix: von den sechs ARTE-Kanälen wurde nur einer richtig einsortiert.
  MediathekViewWeb führt arte je Sprache getrennt - "ARTE.DE", "ARTE.FR",
  "ARTE.EN", "ARTE.ES", "ARTE.IT" und "ARTE.PL" -, und der Crawler setzt
  eine Markierung im Titel nur für Tonspuren, die *nicht* die Standardspur
  des jeweiligen Kanals sind. Die Standardspur selbst trägt also keine
  Markierung, aus der sich ihre Sprache ablesen ließe; dafür gibt es die
  Zuordnung über den Kanalnamen. Eingetragen war dort bisher nur
  "ARTE.FR". Alles von ARTE.EN, ARTE.ES, ARTE.IT und ARTE.PL galt damit
  als deutsch: die Folge wurde nicht als zusätzliche Tonspur neben der
  deutschen abgelegt, sondern als zweites vollständiges Video, und da der
  Dateiname keine Sprachkennung bekam, konnte auch die Duplikaterkennung
  nichts ausrichten. Jetzt sind alle sechs Kanäle eingetragen.

  Die Lücke war nicht geraten, sondern geprüft: die sechs Kanalnamen
  stehen im Quelltext des MediathekView-Crawlers, und dort wird für jeden
  einzelnen auch ein Crawler registriert - sie erreichen den Suchindex
  also tatsächlich alle.

  Hinweis: bereits doppelt geladene Folgen räumt das nicht auf. Die
  zweiten Videodateien können gelöscht werden; beim nächsten Abo-Lauf
  kommt die fremdsprachige Tonspur als ".mka" neben die vorhandene Folge,
  sofern "Neue Tonspuren zu vorhandenen Folgen hinzufügen" aktiviert ist.
