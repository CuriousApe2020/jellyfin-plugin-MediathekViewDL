changelog: >
  Erster Release unter neuer Versionierung (ab v0.0.1) und neuem Namen
  "CuriousApes-MediathekView-Downloader". Baut auf dem aktuellen Stand von
  CatNoir2006/jellyfin-plugin-MediathekViewDL auf und ergänzt: Erkennung
  fehlender Tonspuren (ARD), Auflösung der echten Originalversion-Sprache
  (ARD, arte), optionale Bereinigung eingebetteter Tonspur-Bezeichnungen,
  Sender-übergreifende Tonspur-Gruppierung (arte, ZDF/ZDFneo/3sat),
  Korrektur der arte-Standardsprache (ARTE.FR) sowie diverse Fixes, damit
  dieser Fork parallel zum Original-Plugin installiert und betrieben
  werden kann (eigene API-Routen, eigene Konfigurationsdatei, eigene
  Scheduled-Task-Keys).

