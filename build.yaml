changelog: >
  Fix: die Originalversion-Tonspur wurde bei ARD-Inhalten immer als "und"
  (unbestimmt) getaggt, zum Beispiel die englische Fassung von
  "Sherlock & Daughter". Die Abfrage an die ARD-Page-Gateway-API lief zwar,
  lieferte aber gar keine Mediensammlung mit - im Protokoll endete jede
  Abfrage mit "resolved to (not found)". Es fehlte der Parameter
  "mcV6=true"; ohne ihn antwortet die API nur mit Seiten- und
  Teaser-Daten. Der Parameter wird jetzt mitgeschickt, und die Sprache wird
  aus den Tonspuren der Mediensammlung gelesen
  (streams[].media[].audios[] mit "kind" und "languageCode"): eine von der
  ARD selbst als Originalversion markierte Spur hat Vorrang, sonst zählt die
  erste nicht-deutsche Spur. Untertitel-Sprachen werden dabei ignoriert.
  Zwei- und Locale-Codes ("en", "en-GB") werden auf die dreibuchstabige Form
  ("eng") gebracht, und ein von der ARD selbst geliefertes "und" gilt nicht
  mehr als Treffer.

  Fix: findet der Sender-Abruf nichts (oder ist er abgeschaltet), greift bei
  den aus der Video-URL abgeleiteten Tonspuren jetzt die im Abo bzw. in den
  Standardwerten eingestellte Originalsprache, bevor auf "und" ausgewichen
  wird. Bisher galt diese Einstellung nur für Treffer, die die Suche selbst
  als eigene Zeile liefert; damit lässt sich der Sprach-Tag jetzt in jedem
  Fall von Hand festlegen.
