changelog: >
  Behebt einen Fehler in der Jellyfin-Theme-Erkennung der Einstellungsseite
  (seit v0.0.0.1): Das Plugin sollte die Akzentfarbe von einem echten
  Jellyfin-Bedienelement übernehmen, hat dabei aber ein "customized built-in
  element" (is="emby-button") nicht spezifikationsgerecht erzeugt und dadurch
  nie eine gültige Farbe gemessen - die Einstellungsseite zeigte deshalb
  weiterhin die fest codierte lila Standardfarbe statt der echten
  Jellyfin-Akzentfarbe (typischerweise Blau/Cyan). Behoben durch
  spezifikationsgerechte Erzeugung (document.createElement(tag, { is })) und
  eine kurze Wartezeit vor dem Messen, damit Jellyfin das Element vollständig
  stylen kann, bevor gemessen wird.

