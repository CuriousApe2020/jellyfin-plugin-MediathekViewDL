changelog: >
  Fix: die erweiterte Duplikaterkennung erkannte Filme überhaupt nicht. Sie
  kannte nur Dateien, deren Name eine Staffel-/Folgen- oder absolute Nummer
  hergibt - bei einer echten Bibliothek waren das 7 von 952 eingelesenen
  Dateien unter dem Film-Ordner. Für alle übrigen griff als Einziges die
  Prüfung "Datei existiert bereits" kurz vor dem Schreiben: erst nachdem der
  Auftrag gebaut und eingereiht war, und ohne einen Eintrag im Verlauf zu
  hinterlassen, sodass derselbe Film bei jedem Lauf erneut geprüft wurde.
  Zusätzlich wird jetzt der Pfad abgeglichen, in den der Download schreiben
  würde. Das erkennt auch eine Datei, die ein *anderes* Abo abgelegt hat -
  der Verlauf wird je Abo geführt, ein Abo sieht die Einträge der anderen
  also nicht. Nicht erkannt wird weiterhin eine andere Sprache, und das ist
  Absicht: der Dateiname trägt die Sprache, eine englische Fassung landet
  also bei ihrer eigenen ".eng.mka" und erreicht weiterhin das Anhängen als
  zusätzliche Tonspur.
