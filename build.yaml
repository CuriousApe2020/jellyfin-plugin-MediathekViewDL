changelog: >
  Fehlerbehebung: das Nachtragen von Sprachcodes hat die Tonspur zwar
  umbenannt, sie danach aber trotzdem noch einmal heruntergeladen. Die
  Bibliothek wurde eingelesen, bevor umbenannt wurde, und dieses Bild wird
  fuer einige Minuten gemerkt und von allen Abos geteilt - jeder Lauf in
  diesem Fenster sah weiter die alten "*.und.mka" und hielt die Tonspur fuer
  fehlend. Jetzt wird zuerst nachgetragen, dann gelesen, und ein
  tatsaechliches Umbenennen verwirft das gemerkte Bild.

  Ebenfalls behoben: laufen zwei Abo-Durchgaenge gleichzeitig ueber
  dieselbe Bibliothek, benutzten beide dieselbe Zwischendatei - einer zog
  sie dem anderen unter den Haenden weg ("Could not replace ...
  FileNotFoundException"). Die Zwischendatei ist jetzt pro Vorgang
  eindeutig, und ein vom anderen Durchgang bereits fertiggestellter Wechsel
  gilt als erledigt statt als Fehler.

  Zuvor in 0.0.0.33 bis 0.0.0.35: Umbau der Tonspur-Einstellungen. Im
  Reiter "Download" steht jetzt ein
  Block "Sprachfassungen" mit zwei Betriebsarten: "Alle Sprachen
  herunterladen" (Standard, bisheriges Verhalten) oder "Nur bestimmte
  Sprachen herunterladen" mit einer Liste von ISO-Codes wie "deu, eng". Die
  Auswahl gilt auch fuer die Hauptspur: ist deren Sprache nicht dabei, wird
  die passende Fassung als vollwertiges Video geladen; findet sich gar
  keine, wird die Sendung uebersprungen. Eine Hauptspur ohne erkennbare
  Sprache gilt weiterhin als Deutsch.

  Neu darunter: was passieren soll, wenn die Sprache einer Originalversion
  nicht bestimmbar ist - einen ISO-Code verwenden, als "und" speichern oder
  die Spur nicht speichern. Die frueheren Optionen "Originalsprache" und
  "Undefinierte Originalversionen erlauben" gehen darin auf. Das
  Nachtragen von Sprachcodes ist jetzt eine eigene Option und haengt nicht
  mehr an einem eingetragenen Code: sobald die Sprache feststeht - auch
  wenn der Sender sie erst bei einer Neuausstrahlung nennt -, werden
  vorhandene "*.und.mka" umbenannt und neu getaggt, ohne neu zu kodieren.

  Audiodeskription und klare Sprache stehen jetzt vollstaendig in
  "Barrierefreiheit": zwei getrennte Schalter, jeder mit seinem eigenen
  Untermenue aus den drei Erkennungs-Optionen. Damit laesst sich die eine
  Fassung suchen, ohne die andere mitzunehmen - und beide unabhaengig von den
  Sprachfassungen. "Klare Sprache herunterladen" ist neu und wie die
  Audiodeskription standardmaessig aus: solche Fassungen werden
  uebersprungen, statt wie bisher als gewoehnliche Treffer durchzulaufen.

  Das nachtraegliche Hinzufuegen zu vorhandenen Folgen gibt es getrennt fuer
  Sprachfassungen, Audiodeskription und klare Sprache. Alle drei setzen die
  erweiterte Duplikaterkennung voraus - nur sie liest die Bibliothek ein.
  Fehlt sie, meldet sich ein Hinweisfenster, das sie gleich einschalten kann,
  eine rote Meldung steht an jeder betroffenen Option, und gespeichert wird
  erst wieder, wenn der Widerspruch aufgeloest ist.

  Ausserdem: der Suchfilter heisst jetzt "Nur wenn diese Tonspur verfuegbar
  ist", steht im Reiter "Suche" unter den Dauer-Feldern und akzeptiert
  mehrere ISO-Codes, mit Komma getrennt - erfuellt ist er, sobald eine davon
  vorhanden ist. Die Sender-Abfrage nach der echten
  Originalversion-Sprache laeuft immer und hat keinen eigenen Schalter mehr.
