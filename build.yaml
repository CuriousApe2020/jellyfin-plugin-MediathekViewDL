changelog: >
  Fix: erneuter Anlauf beim "weiß auf weiß"-Problem - der vorherige Versuch
  (0.0.0.15) hatte nur die Grundfarbe der Symbol-Buttons im Abo-Tab
  korrigiert und dabei die eigentlich betroffenen Stellen übersehen. Nach
  wie vor fest auf Weiß gesetzt waren: die Beschriftung der sekundären
  Buttons (Ordner-Auswahl "Ordner auswählen", "Zapp Tuner/Guide
  hinzufügen", "Kopieren"), die Textfarbe *aller* Eingabefelder und
  Auswahllisten, sowie die Hover-Farbe der Symbol-Buttons in Suche,
  Abo-Editor und Download-Dialog. Diese sitzen alle auf einer aus dem
  Theme abgeleiteten Fläche, die auf hellen Themes selbst hell ist - die
  Buttons waren dadurch praktisch unlesbar, und in Eingabefeldern war der
  eingegebene Text unsichtbar.

  Die Theme-Erkennung berechnet jetzt zusätzlich passende Vordergrundfarben
  für Flächen, deren Helligkeit vorab nicht bekannt ist (Akzentfarbe und
  Trennlinienfarbe): Weiß bleibt der Normalfall, auf einer hellen Fläche
  wird automatisch auf Dunkel umgeschaltet. Eingabefelder verwenden jetzt
  die Textfarbe des Themes. Auf dunklen Themes ändert sich dadurch nichts.
