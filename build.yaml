changelog: >
  Behebt die Konfigurations-Kollision mit dem Original-Plugin endgültig -
  0.0.0.4 und 0.0.0.5 haben das Problem nicht wirklich gelöst. Der
  tatsächliche Fehler liegt nicht in .NETs XmlSerializer selbst, sondern in
  Jellyfins eigenem Wrapper dafür (MyXmlSerializer): der cached erzeugte
  XmlSerializer-Instanzen in einem Dictionary, das nur nach dem Klassennamen
  inkl. Namespace (type.FullName) schlüsselt - ohne die Assembly zu
  berücksichtigen. Da Original und Fork bewusst denselben Namespace/Klassen-
  namen "Jellyfin.Plugin.MediathekViewDL.Configuration.PluginConfiguration"
  verwenden, bekommt eines der beiden Plugins beim Speichern/Laden seiner
  Konfiguration den XmlSerializer des JEWEILS ANDEREN Plugins aus diesem
  Cache zurück - unabhängig von XML-Root- oder Typnamen, die 0.0.0.4/0.0.0.5
  geändert hatten. Das erklärt, warum beide vorherigen Versionen den Crash
  nicht behoben haben.

  Die einzige wirksame Lösung: die komplette Konfigurationsklassen-Hierarchie
  des Forks (PluginConfiguration, Subscription, alle Groups/- und
  SubscriptionSettings/-Klassen) läuft jetzt unter einem eigenen,
  Fork-spezifischen Namespace statt dem bisher geteilten. Damit ist
  type.FullName garantiert eindeutig und Jellyfins Cache kann die beiden
  Plugins nicht mehr verwechseln.

  Achtung: Da der Fork zwischen 0.0.0.4 und jetzt bei jedem Start abgestürzt
  ist (die Konfiguration wurde nie erfolgreich gespeichert), gab es in dieser
  Zeit vermutlich keine funktionierende, gespeicherte Fork-Konfiguration.
  Nach dem Update auf 0.0.0.6 startet der Fork daher voraussichtlich mit
  Standardwerten und leeren Abos - bitte einmal prüfen und ggf. neu
  einrichten. Bereits heruntergeladene Dateien in der Jellyfin-Bibliothek
  sind davon nicht betroffen.

