changelog: >
  Fix: nach einem Besuch der Plugin-Einstellungen erschienen auf der
  Jellyfin-Oberfläche Rahmen und Kästen um fremde Elemente - etwa um jede
  Kachel auf der Startseite -, die erst ein Neuladen der Seite wieder
  entfernte. Das Stylesheet der Einstellungsseite wird in den Kopf des
  Dokuments eingefügt und bleibt dort, weil Jellyfins Weboberfläche eine
  Single-Page-Anwendung ist und die Seite nicht neu lädt. Klassennamen wie
  "card", "btn" oder "field" verwendet Jellyfin aber selbst, also galten
  unsere Regeln anschließend auch für dessen Oberfläche. Alle Regeln des
  Plugins gelten jetzt nur noch innerhalb der eigenen Seite und der eigenen
  Dialoge. Gleiches galt für die Animation des Ladekreisels, die eine
  gleichnamige Animation von Jellyfin ersetzen konnte.

  Neu: In der Abo-Verwaltung trennt jetzt eine Linie die einzelnen
  Abonnements voneinander. Deaktivierte Abos bekommen eine gestrichelte
  Trennlinie statt des bisherigen Rahmens um die ganze Zeile.
