changelog: >
  Behebt die gleiche XmlSerializer-Kollision mit dem Original-Plugin wie
  0.0.0.4, diesmal aber in den verschachtelten Konfigurationsklassen statt
  nur in der obersten "PluginConfiguration". Der 0.0.0.4-Fix hat nur die
  oberste Konfigurationsklasse eindeutig benannt - alle Klassen darunter
  (Abos, Pfade, Download-/Such-/Netzwerk-/Wartungsoptionen, Abo-
  Standardwerte, Sender-Suchkriterien) tragen weiterhin denselben
  Namespace/Klassennamen wie im Original und waren daher weiterhin von
  genau derselben Verwechslungsgefahr betroffen (InvalidCastException,
  diesmal beim Schreiben eines einzelnen Abos statt der gesamten
  Konfiguration). Alle diese Klassen bekommen jetzt ebenfalls einen
  expliziten, eindeutigen internen XML-Typnamen.

  Im Unterschied zu 0.0.0.4 bleibt das gespeicherte XML-Format dabei
  unverändert: die betroffenen Klassen werden nur über Eigenschaftsnamen
  bzw. explizit fixierte Element-Namen serialisiert, nicht über den neuen
  internen Typnamen. Bereits gespeicherte Einstellungen, Abos und deren
  Suchkriterien werden also normal weiterverwendet - kein erneutes
  Zurücksetzen wie bei 0.0.0.4.

