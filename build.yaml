changelog: >
  Behebt eine weitere Original/Fork-Kollision im Parallelbetrieb - diesmal
  im Browser statt auf dem Server. Die Einstellungsseite beider Plugins
  verwendet denselben, aus der Jellyfin-Plugin-Vorlage übernommenen
  Container-Element-Namen "configPageVueJSPage". Jellyfins Web-Client
  entfernt die Seite eines zuvor besuchten Plugins beim Navigieren nicht
  immer vollständig aus dem DOM - dadurch konnte document.getElementById()
  die falsche (veraltete) Seite treffen. Sichtbare Folge: es waren immer
  nur bei dem Plugin (Original oder Fork) Einstellungen zu sehen, das
  zuletzt neu geladen wurde; das jeweils andere zeigte nichts an, bis man
  dessen Seite selbst neu lud (wodurch dann wiederum das erste betroffen
  war).

  Der Fork verwendet jetzt einen eigenen, eindeutigen Element-Namen
  ("mediathekViewDLForkConfigPage") statt des geteilten Vorlagen-Namens.
  Reine Frontend-Änderung, keine Auswirkung auf Konfiguration oder Abos.

