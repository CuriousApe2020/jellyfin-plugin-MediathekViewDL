changelog: >
  Behebt die violette Akzentfarbe der Einstellungsseite, die nie zum
  aktiven Jellyfin-Theme gepasst hat. Ursache: die bisherige
  Theme-Erkennung ging davon aus, dass Jellyfins Web-Client seine
  Theme-Farben grundsätzlich nicht als CSS-Variablen bereitstellt, und hat
  deshalb stattdessen versucht, sie aus unsichtbar gerenderten
  Jellyfin-Elementen abzulesen. Diese Annahme war falsch: Jellyfin (ab
  10.11 bestätigt) setzt die aktiven Theme-Farben tatsächlich als
  "--jf-palette-*"-CSS-Variablen (u.a. "--jf-palette-primary-main",
  "--jf-palette-background-default", "--jf-palette-text-primary") direkt
  auf <body>. Die alte Messmethode traf diese Werte nicht zuverlässig und
  fiel deshalb still auf eine fest einprogrammierte violette Standardfarbe
  zurück.

  Die Einstellungsseite liest die Akzent-, Hintergrund-, Text- und
  Rahmenfarben jetzt direkt aus Jellyfins eigenen "--jf-palette-*"-
  Variablen und passt sich damit korrekt an das aktive Theme an
  (einschließlich benutzerdefinierter Skins, die diese Variablen setzen).
  Fehlt eine Variable (z.B. bei einer älteren Jellyfin-Version), wird
  weiterhin sicher auf die bisherige Standardpalette zurückgefallen. Reine
  Frontend-Änderung, keine Auswirkung auf Konfiguration oder Abos.

  Auch die violette Fallback-Farbe selbst ist jetzt Jellyfins eigenes
  Standard-Akzentblau (#00a4dc statt #7c3aed). Sie greift ohnehin nur
  noch, wenn Jellyfins "--jf-palette-primary-main"-Variable aus
  irgendeinem Grund nicht gelesen werden kann - dann passt jetzt
  wenigstens die Fallback-Farbe selbst zu Jellyfin, statt beliebig lila zu
  sein.
