changelog: >
  Fix: dieselbe Datei konnte in einem Lauf mehrfach eingeplant werden. Zwei
  Abos, die auf denselben Ordner zeigen, sahen einander nicht - der
  Download-Verlauf wird je Abo geführt - und die Datei gab es noch nicht,
  also reihten beide sie ein. Gestoppt hat das erst die Prüfung "Datei
  existiert bereits" unmittelbar vor dem Schreiben. Ein gebauter Auftrag
  meldet seine Zieldateien jetzt vor, der Rest des Laufs behandelt sie als
  vergeben. In den Verlauf kommt das nicht: eine Vormerkung ist ein Plan,
  und Pläne scheitern.

  Fix: innerhalb eines Auftrags konnten zwei Tonspur-Downloads dieselbe
  Datei schreiben. Zwei getrennte Stellen hängen zusätzliche Tonspuren an
  und leiten den Namen beide nur aus der Sprache ab, zwei Treffer derselben
  Sprache landeten also auf derselben ".mka". Der zweite lud damit erneut,
  was der erste eben geschrieben hatte, und legte einen zweiten,
  gleichlautenden Verlaufseintrag an.

  Schneller: das Einlesen eines Zielverzeichnisses wird innerhalb eines
  Laufs wiederverwendet. Bisher wurde derselbe Baum mehrfach durchlaufen -
  in einem echten Lauf /media/Serien (21440 Dateien) dreimal und
  /media/Filme dreimal, 30,6 der insgesamt 48,7 Sekunden Einlesezeit waren
  Doppelarbeit. Zu Beginn jedes Abo-Laufs wird verworfen, was frühere Läufe
  gesehen haben, damit ein Lauf nie auf einem veralteten Bild der
  Bibliothek aufsetzt.
