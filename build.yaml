changelog: >
  Fix: in der Abo-Oberflaeche waren die nicht ausgewaehlten Feld-Schalter
  einer Suchanfrage ("Beschreibung", "Sender") weiss auf weiss und damit
  unlesbar. Ursache war die Theme-Erkennung: Jellyfins Palette gibt mehrere
  Toene mit Transparenz an - im dunklen Standard-Theme ist die Trennlinie
  ein weisses rgba mit 12 Prozent Deckkraft -, und beim Uebernehmen ging die
  Transparenz verloren. Aus "weiss mit 12 Prozent" wurde deckendes Weiss,
  und genau diese Farbe dient den Schaltern als Hintergrund. Gemessene
  Farben werden jetzt vor dem Uebernehmen mit dem Untergrund verrechnet,
  also so, wie der Browser sie tatsaechlich zeichnet. Das betrifft auch die
  abgeleitete Lesbarkeitsfarbe, die vorher gegen Weiss berechnet wurde.

  Neu: der Filter "Nur mit Tonspur (ISO Code)" steht jetzt im Reiter "Suche"
  direkt unter den Suchanfragen, statt unter "Barrierefreiheit" - er
  entscheidet, welche Treffer ueberhaupt in Frage kommen, und gehoert damit
  zur Suche.
