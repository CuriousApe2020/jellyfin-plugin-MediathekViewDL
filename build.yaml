changelog: >
  Neu: alle Optionen zur Tonspur-Erkennung stehen jetzt gesammelt im Reiter
  "Metadaten" unter "Tonspur-Erkennung" - als Baum, der zeigt, was wovon
  abhaengt: was gefunden wird (URL-Muster, verwandte Suchtreffer), was davon
  geladen wird (Originalversion, Audiodeskription, klare Sprache), wie die
  Sprache der Originalversion bestimmt wird, ob Tonspuren an vorhandene
  Folgen gehaengt werden und wie die Tonspur-Bezeichnungen aussehen. Im
  Reiter "Download" stehen nur noch die Download-Optionen. Gespeichert wird
  unveraendert - bestehende Abos behalten alle Einstellungen.

  Neu: "Undefinierte Originalversionen erlauben". Die Sprache einer
  Originalversion wird in dieser Reihenfolge bestimmt: Sender-Abfrage,
  eingestellte Originalsprache des Abos, globaler Standardwert. Liefert
  keine davon eine Sprache - z.B. bei ARD/ONE, wo als Tonspur-Sprache nur
  "ov" gemeldet wird -, entscheidet die neue Option: aktiviert wird die
  Tonspur wie bisher als "und" gespeichert, deaktiviert schlaegt der
  Download genau dieser Tonspur mit einer klaren Fehlermeldung fehl, die in
  der Download-Liste steht. Das Hauptvideo ist davon nie betroffen.
  Voreinstellung ist "erlaubt", also das bisherige Verhalten.

  Neu: fehlende Sprachcodes werden nachgetragen. Wird eine Originalsprache
  erst gesetzt, nachdem schon Folgen geladen wurden, werden vorhandene
  "*.und.mka" beim naechsten Abo-Lauf umbenannt und der Sprach-Tag in der
  Datei gesetzt - ohne neu zu kodieren und ohne das Video anzufassen. Nach
  einem manuellen Download passiert dasselbe fuer den Zielordner. Eine
  Datei wird nur ersetzt, wenn das Umschreiben geklappt hat; existiert die
  Zieldatei schon, bleibt alles unveraendert.
