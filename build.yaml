changelog: >
  Neu: Option "Neue Tonspuren zu vorhandenen Folgen hinzufügen" (Download-
  Reiter eines Abos bzw. Abo-Standardwerte). Bisher war die
  Duplikaterkennung sprachbewusst: lag eine Folge nur auf Englisch vor,
  galt dieselbe Folge auf Deutsch als neu und wurde als zweites,
  nahezu identisches Video heruntergeladen - Jellyfin zeigte die Folge
  dann doppelt statt als einen Eintrag mit auswählbaren Tonspuren. Ist
  die Option aktiviert, wird in diesem Fall nur noch die Tonspur geladen
  und als zusätzliche Tonspur-Datei (.mka) neben das bereits vorhandene
  Video gelegt - genauso, wie es bei frisch heruntergeladenen Folgen
  schon immer passiert ist. Die vorhandene Videodatei wird dabei nicht
  geöffnet, verändert oder verschoben. Setzt "Erweiterte
  Duplikaterkennung" voraus und ist standardmäßig deaktiviert.

  Fix: beim Einlesen der Bibliothek wurde die Sprache von Tonspur-Dateien
  nicht erkannt. Der Dateiname erreichte die Spracherkennung ohne
  Dateiendung ("Titel.eng" statt "Titel.eng.mka"), womit die Sprache nicht
  mehr das vorletzte Segment war und stillschweigend auf Deutsch
  zurückfiel. Eine englische Tonspur galt dadurch als deutsche - was ohne
  die neue Option folgenlos blieb, mit ihr aber dazu geführt hätte,
  dieselbe Tonspur bei jedem Lauf erneut zu laden.
