changelog: >
  Behebt eine weitere Kollision mit dem Original-Plugin im Parallelbetrieb,
  diesmal in .NETs XmlSerializer statt in unserem eigenen Code: Original und
  Fork deklarieren beide eine Klasse
  "Jellyfin.Plugin.MediathekViewDL.Configuration.PluginConfiguration" (gleicher
  Namespace/Klassenname, bewusst beibehalten). .NETs XmlSerializer generiert
  und cached seinen (De-)Serialisierungscode anhand des Root-Element-Namens,
  der standardmäßig vom einfachen Klassennamen abgeleitet wird - dadurch
  wurden bei gleichzeitig geladenen Plugins die beiden eigentlich
  unterschiedlichen Typen verwechselt (InvalidCastException beim Lesen oder
  Speichern der Konfiguration, sowohl beim Original als auch im Fork selbst).
  Der Fork deklariert seine Konfigurationsklasse jetzt mit einem expliziten,
  eindeutigen XML-Root-Namen.

  Achtung: Da sich dadurch das erwartete XML-Root-Element ändert, wird eine
  bereits gespeicherte Konfiguration dieses Forks beim ersten Start mit
  dieser Version nicht mehr erkannt und einmalig auf Standardwerte
  zurückgesetzt (der Einrichtungs-Assistent erscheint dann erneut). Bereits
  heruntergeladene Dateien und Abos in der Jellyfin-Bibliothek sind davon
  nicht betroffen.

