changelog: >
  Behebt eine kritische Namenskollision mit dem Original-Plugin (CatNoir2006/jellyfin-plugin-MediathekViewDL):
  die DLL dieses Forks hieß intern noch genauso wie die des Original-Plugins
  (Jellyfin.Plugin.MediathekViewDL.dll). Jellyfin leitet den Dateinamen der Plugin-Konfiguration
  (Einstellungen + Abos) vom Assembly-Dateinamen ab, nicht vom Plugin-Namen. Bei gleichzeitiger
  Installation beider Plugins hätten dadurch beide dieselbe Konfigurationsdatei gelesen und
  geschrieben und sich so gegenseitig überschrieben. Die DLL heißt jetzt
  Jellyfin.Plugin.MediathekViewDL.CuriousApe2020Fork.dll.

