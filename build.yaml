changelog: >
  Fix: bei ARD-Originalversionen von ONE/WDR (z. B. "Sherlock & Daughter")
  blieb die Tonspur trotz 0.0.0.28 auf "und". Grund: diese Beitraege melden
  als Tonspur-Sprache den Text "ov" - die ARD sagt damit "das ist die
  Originalfassung", nennt die Sprache aber nicht. "ov" wird jetzt als das
  erkannt, was es ist (keine Sprache), landet nie mehr als Sprach-Tag in der
  Datei und wird im Protokoll klar benannt: "ARD lists ... as an original
  version but does not name its language".

  Neu: die eingestellte Originalsprache wird jetzt auch aus den globalen
  Standardwerten uebernommen, wenn das Abo selbst keine gesetzt hat. Damit
  laesst sich die Luecke fuer genau diese Sender-Beitraege einmal zentral
  schliessen (Einstellungen - Standardwerte - Originalsprache, z. B. "eng"),
  statt sie in jedem Abo einzeln zu pflegen. Reihenfolge unveraendert:
  Sender-Abfrage zuerst, dann Abo-Einstellung, dann globaler Standardwert,
  erst danach "und".
