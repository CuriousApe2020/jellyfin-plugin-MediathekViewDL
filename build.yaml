changelog: >
  Fix: der Hintergrund des Abo-Fensters ("Neues Abo" / "Bearbeiten") war
  durchsichtig, sodass die Liste dahinter durchschien. Ursache waren zwei
  voneinander unabhängige Dinge. Zum einen trugen unsere Karten und Dialoge
  die Klasse "card" - denselben Namen, den Jellyfin für seine eigenen
  Poster-Kacheln verwendet, teils mit "!important". Damit landeten
  Jellyfin-Regeln auf unseren Elementen und überschrieben unseren
  Hintergrund. Alle Stellen heißen jetzt "mvpl-card". Zum anderen wurden die
  Theme-Farben nur auf der Plugin-Seite gesetzt, die Dialoge hängen als
  Teleport aber direkt am Body und lagen damit außerhalb - sie fielen immer
  auf die fest eingebaute dunkle Palette zurück. Die Farben werden jetzt
  zusätzlich am Body gesetzt, sodass die Dialoge dieselbe Hintergrundfarbe
  tragen wie der Rest der Seite, auch in hellen Themes.

  Fix: die Abo-Seite lief auf schmalen Bildschirmen (Handy) horizontal über.
  Die Overlays waren 100% breit plus 20px Innenabstand und damit 40px breiter
  als der Bildschirm; sie rechnen den Abstand jetzt ein. Außerdem: die
  Tab-Leiste scrollt seitlich, statt die Seite zu dehnen, lange Abo-Namen
  brechen um, statt die Zeile aufzuweiten, und unter 600px stehen Name und
  Aktionsknöpfe untereinander, mit größeren Abständen zwischen den
  Knöpfen.
