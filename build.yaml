overview: "Sucht und lädt Inhalte aus den Mediatheken über die MediathekViewWeb-API. Community-Fork mit zusätzlichen Funktionen (Nebenspur-Erkennung, Originalversion-Sprachauflösung, Sender-übergreifende Tonspur-Gruppierung)."
description: >
  Mit dem Plugin kann man die Mediatheken der öffentlich-rechtlichen Sender in Deutschland durchsuchen und Inhalte herunterladen.
  Für die suche wird die MediathekViewWeb-API verwendet. Der Videos werden direkt über die Original-URLs der Sender heruntergeladen.
  Es können Abos anglegt werden um z.B. Serien automatisch herunterzuladen.
  Dies ist ein Community-Fork von CatNoir2006/jellyfin-plugin-MediathekViewDL mit zusätzlichen, noch nicht upstream gemergten Funktionen.
category: "General"
owner: "CuriousApe2020"
artifacts:
- "Jellyfin.Plugin.MediathekViewDL.CuriousApe2020Fork.dll"
- "FuzzySharp.dll"

changelog: >
  Neu: optionaler Tonspur-Filter pro Abo ("Barrierefreiheit"-Reiter bzw.
  Abo-Standardwerte), "Nur mit Tonspur (ISO Code, z.B. 'eng')". Wenn
  gesetzt, werden nur Titel heruntergeladen, die zusätzlich zur Hauptspur
  eine Tonspur in dieser Sprache haben - egal ob MediathekView sie als
  eigenen Suchtreffer findet ("Verwandte Suchtreffer zusammenführen") oder
  sie erst über den URL-Workaround erkannt wird ("Fehlende Tonspuren
  erkennen"). Titel ohne passende Tonspur werden komplett übersprungen,
  auch die Hauptspur wird dann nicht heruntergeladen. Standardmäßig leer
  (deaktiviert) - kein Verhaltensunterschied für bestehende Abos.

  Fix: der Tonspur-Filter wurde beim "Abo prüfen (Dry Run)" bisher gar
  nicht angewendet - die Vorschau zeigte weiterhin alle Treffer, egal ob
  eine passende Tonspur gefunden wurde oder nicht. Ursache war, dass der
  Dry-Run-Pfad intern nicht denselben Code wie der echte Download-Lauf
  durchläuft. Die Vorschau prüft jetzt denselben Filter (inkl. Erkennung
  über "Verwandte Suchtreffer zusammenführen" und "Fehlende Tonspuren
  erkennen") und zeigt nur noch Titel an, die auch tatsächlich
  heruntergeladen würden.

  Fix: durch "Erweiterte Duplikaterkennung" bereits lokal gefundene,
  längst vorhandene Dateien (z.B. eine Audiodeskription-Spur, die
  heruntergeladen wurde bevor "Audiodeskription erlauben" deaktiviert
  wurde) sprangen bei jedem Abo-Lauf erneut mit dem aktuellen Zeitstempel
  an die Spitze des Download-Verlaufs, obwohl gar nichts neu
  heruntergeladen wurde. Der Verlaufseintrag wird jetzt nur noch einmal
  pro Abo nachgetragen, nicht bei jedem erneuten Fund.

  Neu (von CatNoir2006/jellyfin-plugin-MediathekViewDL übernommen, PR #179):
  virtuelle Abos. Ein Abo kann jetzt als "Virtuell" markiert werden - es
  werden dann keine Dateien heruntergeladen und keine STRMs erstellt.
  Stattdessen erscheinen die Sendungen im neuen Jellyfin-Kanal "Mediathek
  (Virtual) [CuriousApe2020 Fork]" und werden bei der Wiedergabe direkt aus
  der Mediathek gestreamt. Der Kanalname weicht bewusst vom Original-Plugin
  ab, damit beide Kanäle unterscheidbar bleiben, falls beide Plugins
  gleichzeitig installiert sind.
