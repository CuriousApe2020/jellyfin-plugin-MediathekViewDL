overview: "Sucht und lädt Inhalte aus den Mediatheken über die MediathekViewWeb-API. Community-Fork mit zusätzlichen Funktionen (Nebenspur-Erkennung, Originalversion-Sprachauflösung, Sender-übergreifende Tonspur-Gruppierung)."
description: >
  Mit dem Plugin kann man die Mediatheken der öffentlich-rechtlichen Sender in Deutschland durchsuchen und Inhalte herunterladen.
  Für die suche wird die MediathekViewWeb-API verwendet. Der Videos werden direkt über die Original-URLs der Sender heruntergeladen.
  Es können Abos anglegt werden um z.B. Serien automatisch herunterzuladen.
  Dies ist ein Community-Fork von CatNoir2006/jellyfin-plugin-MediathekViewDL mit zusätzlichen, noch nicht upstream gemergten Funktionen.
