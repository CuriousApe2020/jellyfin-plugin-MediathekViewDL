changelog: >
  Fix: fehlende Schreibrechte im Zielverzeichnis brechen den Download jetzt
  sofort ab, statt jede Datei einzeln scheitern zu lassen. Bisher lief ein
  Auftrag nach dem ersten Rechtefehler weiter durch Video, Untertitel,
  Tonspuren und NFO - jeder Teil scheiterte an derselben Ursache und
  hinterließ einen eigenen Stacktrace im Log. Erschwerend meldete ffmpeg
  ein nicht beschreibbares Zielverzeichnis nur als gewöhnlichen Fehlercode,
  also ununterscheidbar von einem nicht erreichbaren Sender. Das
  Zielverzeichnis wird nun vor dem Download einmal auf Schreibbarkeit
  geprüft; schlägt das fehl, erscheint eine einzelne, klare Meldung
  statt eines Fehlerbergs. Der Download wird nicht in den Verlauf
  eingetragen und beim nächsten Abo-Lauf automatisch erneut versucht - sind
  die Rechte bis dahin korrigiert, läuft er ohne weiteres Zutun durch.
