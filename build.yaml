changelog: >
  Fix: eine Sprachmarkierung als reiner ISO-Code im Titel wurde nicht
  erkannt. Das ZDF kennzeichnet die niederländische Originalfassung von
  "Blind Sherlock" als "(nld)" - erkannt wurden bisher nur ausgeschriebene
  Sprachnamen wie "(Niederländisch)" oder "(Englisch)". Die Folge behielt
  die Markierung damit im Titel, galt als die gewöhnliche deutsche Fassung
  und wurde ein zweites Mal als vollständiges Video geladen, statt als
  zusätzliche Tonspur neben der deutschen zu landen: "S01E02 - Who you
  gonna call_ (nld).mkv" neben "S01E02 - Who you gonna call_.mkv". Da sich
  die Dateinamen unterscheiden, konnte auch die Duplikaterkennung nichts
  ausrichten, und Jellyfin zeigte die Folge doppelt. Dreibuchstabige Codes
  werden jetzt erkannt, und zwar erst nachdem jede Klammer auf einen
  ausgeschriebenen Sprachnamen geprüft wurde. Zweibuchstabige bleiben
  bewusst unberücksichtigt: "is", "it", "no" und "so" sind allesamt
  Sprachen und würden gewöhnlichen Klammertext falsch deuten.

  Hinweis: bereits doppelt geladene Folgen räumt das nicht auf. Die
  "(nld)"-Dateien können gelöscht werden; beim nächsten Abo-Lauf kommt die
  niederländische Tonspur als ".nld.mka" neben die vorhandene Folge, sofern
  "Neue Tonspuren zu vorhandenen Folgen hinzufügen" aktiviert ist.
