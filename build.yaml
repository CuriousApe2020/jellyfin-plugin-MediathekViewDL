- "FuzzySharp.dll"

changelog: >
  Fix: die Option "Absolute Episodennummerierung erlauben" hatte nie eine
  Wirkung. Die zugehörige Prüfung verlangte zusätzlich, dass der Treffer
  *nicht* als Serie erkannt wurde - genau das schließt aber die direkt
  darüberliegende Prüfung von "Nur Serien herunterladen" bereits aus, die
  solche Treffer schon vorher aussortiert. Die Bedingung konnte damit nie
  zutreffen, das Häkchen war folgenlos. Jetzt werden bei aktivem "Nur
  Serien herunterladen" und abgewähltem Häkchen tatsächlich die Folgen
  übersprungen, die nur eine absolute Episodennummer haben. Rein
  datumsbetitelte Sendungen (z.B. Nachrichten) und Treffer mit nur einer
  Staffelangabe sind davon bewusst nicht betroffen.

  Fix: beim Beenden von Jellyfin bzw. Entladen des Plugins wurden die
  internen Synchronisationsobjekte der Download-Warteschlange sofort
  freigegeben, während ein Download noch lief. Der laufende Download gab
  danach eine bereits freigegebene Sperre zurück, was eine unbeachtete
  Ausnahme auslöste; zudem wurde er überhaupt nicht abgebrochen und lief
  gegen eine schon abgebaute Umgebung weiter. Das Beenden bricht laufende
  Downloads jetzt aktiv ab und wartet begrenzt auf deren Ende, bevor
  aufgeräumt wird. Außerdem werden die Abbruch-Objekte beendeter Downloads
  jetzt freigegeben, statt sich über die Laufzeit anzusammeln.

  Fix: schlug beim Herunterladen nur eine Begleitdatei fehl (typischerweise
  die Untertitel), wurde für das erfolgreich geladene Video keine
  NFO-Datei erstellt - und beim nächsten Lauf auch nicht nachgeholt, da das
  Video dann bereits vorhanden war. Die NFO wird jetzt erstellt, sobald die
  eigentliche Mediendatei vorliegt.

  Intern: die Abo-Liste wird beim Anlegen/Ändern/Löschen über die
  Weboberfläche und beim Einlesen durch den Zeitplan-Task jetzt gegen
  gleichzeitigen Zugriff abgesichert; eine ungenutzte Basisklasse
  (BaseDownloadHandler) wurde entfernt.
