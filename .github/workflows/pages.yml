name: Deploy VueJS Preview to Pages

on:
  push:
    branches: ["master"]
    paths:
      - 'Jellyfin.Plugin.MediathekViewDL/Configuration/Web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Jellyfin.Plugin.MediathekViewDL/Configuration/Web/VueJS/package-lock.json'

      - name: Install dependencies
        working-directory: Jellyfin.Plugin.MediathekViewDL/Configuration/Web/VueJS
        run: npm ci

      - name: Build VueJS
        working-directory: Jellyfin.Plugin.MediathekViewDL/Configuration/Web/VueJS
        run: npm run build

      - name: Prepare artifact
        run: |
          mkdir deployment
          cp Jellyfin.Plugin.MediathekViewDL/Configuration/Web/index_preview.html deployment/index.html
          cp Jellyfin.Plugin.MediathekViewDL/Configuration/Web/VueJS/dist/MediathekViewDLForkVueJS.js deployment/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deployment'

  # A Pages deployment needs a Pages site, and that is a repository setting no workflow can turn on
  # for itself. Without it actions/deploy-pages ends with a bare 404 - which is what every single
  # run of this workflow did since the fork started, while the build job above was green each time.
  # A job that cannot succeed for reasons outside the repository's own code should not report the
  # commit as broken, so the site is asked about first and the deployment skipped cleanly when there
  # is none. Nothing here needs changing once Pages is switched on under
  # Settings -> Pages -> Build and deployment -> Source: GitHub Actions; the next run just publishes.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Vorschau nicht veroeffentlicht::GitHub Pages ist fuer dieses Repository nicht aktiviert, die gebaute Vorschau wurde deshalb nur als Artefakt abgelegt. Zum Veroeffentlichen unter Settings -> Pages -> Build and deployment -> Source auf "GitHub Actions" stellen.'
          fi

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
